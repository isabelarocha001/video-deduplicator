[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-deduplicator"
version = "0.1.0"
description = "Remover duplicidade de vídeo – processador/normalizador de vídeo com FFmpeg"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Lamarc" }
]
keywords = ["video", "ffmpeg", "processing", "normalization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = ["fastapi>=0.110.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
duplicate-redteam = [
    "Pillow>=9.0.0",
    "imagehash>=4.3.0",
    "numpy>=1.22.0",
    "supabase>=2.0.0",
]

[project.scripts]
video-deduplicator = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.vercel]
entrypoint = "api.index:app"
