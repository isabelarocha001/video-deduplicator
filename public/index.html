<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Lux · Rede Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Top nav -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="logo" aria-label="Início">Lux</a>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="themeToggle" title="Alternar tema" aria-label="Alternar tema claro/escuro">
          <span class="icon-sun" aria-hidden="true">☀</span>
          <span class="icon-moon" aria-hidden="true">☾</span>
        </button>
        <button type="button" class="icon-btn" title="Notificações" aria-label="Notificações">♡</button>
        <button type="button" class="icon-btn" title="Mensagens" aria-label="Mensagens">✉</button>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- Profile header -->
    <section class="profile" aria-label="Perfil">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar">
          <img
            id="avatarImg"
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&h=400&fit=crop&crop=face"
            alt="Foto de perfil de Sofia Rivera"
            width="150"
            height="150"
          />
        </div>
        <button type="button" class="avatar-story-ring" title="Ver stories" aria-label="Stories"></button>
      </div>

      <div class="profile-info">
        <div class="profile-title-row">
          <h1 class="profile-username">sofiarivera</h1>
          <div class="profile-actions">
            <button type="button" class="btn btn-primary" id="btnFollow">Seguir</button>
            <button type="button" class="btn btn-secondary">Mensagem</button>
            <button type="button" class="btn btn-icon" title="Mais opções" aria-label="Mais">▾</button>
          </div>
        </div>

        <ul class="profile-stats" role="list">
          <li><strong>128</strong> publicações</li>
          <li><button type="button" class="stat-link"><strong>24,8 mil</strong> seguidores</button></li>
          <li><button type="button" class="stat-link"><strong>312</strong> seguindo</button></li>
        </ul>

        <div class="profile-bio">
          <p class="profile-name">Sofia Rivera</p>
          <p class="profile-text">
            Criadora de conteúdo · lifestyle &amp; viagens<br />
            📍 São Paulo<br />
            <a href="#" class="bio-link">linktr.ee/sofiarivera</a>
          </p>
        </div>
      </div>
    </section>

    <!-- Highlights -->
    <section class="highlights" aria-label="Destaques">
      <button type="button" class="highlight">
        <span class="highlight-circle"><img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=120&h=120&fit=crop" alt="" /></span>
        <span class="highlight-label">Viagens</span>
      </button>
      <button type="button" class="highlight">
        <span class="highlight-circle"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=120&h=120&fit=crop" alt="" /></span>
        <span class="highlight-label">Looks</span>
      </button>
      <button type="button" class="highlight">
        <span class="highlight-circle"><img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=120&h=120&fit=crop" alt="" /></span>
        <span class="highlight-label">Café</span>
      </button>
      <button type="button" class="highlight highlight-new">
        <span class="highlight-circle highlight-plus">+</span>
        <span class="highlight-label">Novo</span>
      </button>
    </section>

    <!-- Tabs -->
    <nav class="tabs" role="tablist" aria-label="Conteúdo do perfil">
      <button type="button" class="tab is-active" role="tab" aria-selected="true" data-tab="posts">▦ Publicações</button>
      <button type="button" class="tab" role="tab" aria-selected="false" data-tab="reels">▶ Reels</button>
      <button type="button" class="tab" role="tab" aria-selected="false" data-tab="tagged">👤 Marcadas</button>
    </nav>

    <!-- Posts grid -->
    <section class="grid" id="postsGrid" aria-label="Publicações">
      <!-- filled by JS -->
    </section>
  </main>

  <!-- Bottom nav (mobile) -->
  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="/" class="nav-item is-active" aria-current="page">
      <span class="nav-icon">⌂</span>
      <span class="nav-label">Início</span>
    </a>
    <button type="button" class="nav-item">
      <span class="nav-icon">⌕</span>
      <span class="nav-label">Buscar</span>
    </button>
    <button type="button" class="nav-item nav-create">
      <span class="nav-icon">＋</span>
      <span class="nav-label">Criar</span>
    </button>
    <button type="button" class="nav-item">
      <span class="nav-icon">▶</span>
      <span class="nav-label">Reels</span>
    </button>
    <a href="/" class="nav-item">
      <span class="nav-avatar">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=80&h=80&fit=crop&crop=face" alt="Seu perfil" />
      </span>
      <span class="nav-label">Perfil</span>
    </a>
  </nav>

  <script src="/js/app.js"></script>
</body>
</html>
